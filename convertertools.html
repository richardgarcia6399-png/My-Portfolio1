<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bootstrap Converter Tool</title>
  <!-- Bootstrap 5.3 + Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .cat-ico { font-size:1.6rem;width:2em;display:inline-flex;align-items:center;justify-content:center;}
    .result-area {background: var(--bs-light-bg-subtle,#f8fafc);border-radius:0.5em;}
    [data-bs-theme=dark] .result-area {background:#212735;}
    .history-item {border-radius:.4em;}
    .ad-block {margin-block:1.5rem;}
    @media (max-width:700px){
      .row-cols-lg-2 > * { flex: 0 0 100%; max-width:100%; }
      .ad-block{margin-block:1rem;}
    }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <div class="cat-ico" id="cat-ico-head"><i class="bi bi-rulers"></i></div>
    <h2 class="mb-0">Converter Tool</h2>
    <button class="btn btn-outline-secondary btn-sm ms-auto" id="theme-btn" type="button" aria-label="Toggle theme"><i class="bi bi-brightness-high"></i></button>
  </div>
  <div class="row row-cols-1 row-cols-lg-2 g-4">
    <div class="col">
      <form id="convForm" autocomplete="off" class="card card-body shadow-sm">
        <div class="mb-3">
          <label class="form-label">Category</label>
          <div class="input-group">
            <span class="input-group-text cat-ico" id="cat-ico"><i class="bi bi-rulers"></i></span>
            <select class="form-select" id="category"></select>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col">
            <label class="form-label">From</label>
            <select class="form-select" id="fromUnit"></select>
          </div>
          <div class="col-auto d-flex align-items-end"><button id="swap" type="button" class="btn btn-outline-primary px-2" title="Swap"><i class="bi bi-arrow-left-right"></i></button></div>
          <div class="col">
            <label class="form-label">To</label>
            <select class="form-select" id="toUnit"></select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Value</label>
          <input id="value" class="form-control" type="number" step="any" placeholder="Enter value" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2"><i class="bi bi-arrow-repeat"></i> Convert</button>
        <div class="result-area p-3 mb-1">
          <div class="d-flex align-items-baseline gap-2">
            <span class="fs-5 fw-bold me-2" id="resultValue">—</span>
            <span id="resultSub" class="text-muted"></span>
          </div>
          <pre class="mt-2 small text-body-secondary" id="steps" style="background:transparent;white-space:pre-wrap;"></pre>
          <div class="mt-2 d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="copyResult"><i class="bi bi-clipboard"></i> Copy Result</button>
          </div>
        </div>
      </form>
    </div>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4722240084988727"
     crossorigin="anonymous"></script>
<!-- Footer-ad -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-4722240084988727"
     data-ad-slot="6961558425"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
    <div class="col">
      <div class="card card-body shadow-sm mb-4 mb-lg-0">
        <div class="d-flex align-items-center mb-2">
          <h5 class="mb-0">History</h5>
          <button class="btn btn-link ms-auto px-2 py-1 text-danger" id="clearHistory" title="Clear history"><i class="bi bi-trash"></i></button>
        </div>
        <div id="history"></div>
      </div>
    </div>
  </div>
</div>
<footer class="text-center py-3 text-secondary small">Developed by RTG</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
